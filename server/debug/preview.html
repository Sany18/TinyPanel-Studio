<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyPanel Preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { display: grid; place-items: center; padding: 12px; background: #0b0d12;
    color: #8b96a8; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .display-ruler { display: grid; grid-template-columns: 36px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) 30px; width: min(calc(100vw - 24px), calc((100vh - 54px) * 1.25 + 36px));
    aspect-ratio: 676 / 542; }
  .canvas-wrap { position: relative; grid-column: 2; grid-row: 1; min-width: 0; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated;
    border: 1px solid #394152; background: #000; }
  .canvas-wrap::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to right, #ffffff18 1px, transparent 1px),
      linear-gradient(to bottom, #ffffff18 1px, transparent 1px);
    background-size: 10% 100%, 100% 12.5%; }
  .canvas-wrap.grid-hidden::after { display: none; }
  #grid-toggle { position: fixed; z-index: 2; left: 10px; bottom: 8px; width: 22px; height: 22px;
    padding: 0; border: 1px solid #596579; border-radius: 0; background: #0b0d12cc;
    color: #d8dee9; font: 15px/20px ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: pointer; }
  #grid-toggle[aria-pressed="false"] { color: #657084; background: #0b0d12aa; }
  #grid-toggle:hover { border-color: #6ec8ff; color: #6ec8ff; }
  .ruler-x, .ruler-y { position: relative; color: #8b96a8; font-size: 10px; user-select: none; }
  .ruler-x { grid-column: 2; grid-row: 2; border-top: 1px solid #465064; }
  .ruler-y { grid-column: 1; grid-row: 1; border-right: 1px solid #465064; }
  .ruler-x::before { content: ''; position: absolute; inset: 0 0 auto; height: 8px;
    background: repeating-linear-gradient(to right, #596579 0 1px, transparent 1px 6.25%); }
  .ruler-y::before { content: ''; position: absolute; inset: 0 0 0 auto; width: 8px;
    background: repeating-linear-gradient(to bottom, #596579 0 1px, transparent 1px 12.5%); }
  .ruler-label { position: absolute; line-height: 1; }
  .ruler-x .ruler-label { top: 12px; transform: translateX(-50%); }
  .ruler-y .ruler-label { right: 12px; transform: translateY(-50%); }
  .ruler-x .ruler-label:first-child { transform: none; }
  .ruler-x .ruler-label:last-child { transform: translateX(-100%); }
  .ruler-y .ruler-label:first-child { transform: none; }
  .ruler-y .ruler-label:last-child { transform: translateY(-100%); }
  .ruler-corner { grid-column: 1; grid-row: 2; padding: 11px 5px 0 0; text-align: right;
    color: #6ec8ff; font-size: 10px; }
  #status { position: fixed; right: 10px; bottom: 8px; padding: 3px 6px;
    background: #0b0d12cc; border-radius: 4px; font-size: 10px; }
</style>
</head>
<body>
  <div class="display-ruler">
    <div id="ruler-y" class="ruler-y"></div>
    <div id="canvas-wrap" class="canvas-wrap"><canvas id="panel" width="160" height="128"></canvas></div>
    <div class="ruler-corner">Y/X</div>
    <div id="ruler-x" class="ruler-x"></div>
  </div>
  <button id="grid-toggle" type="button" aria-pressed="true" aria-label="Toggle preview grid" title="Toggle preview grid">▦</button>
  <div id="status">waiting for a device…</div>
  <script src="preview-client.js"></script>
</body>
</html>
